name: Check upstream release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  STACK_BASE: release-3.6.6

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          remote: upstream

      - name: Fetch upstream tags
        run: git remote rename origin desktop 2>/dev/null || true; git remote add desktop https://github.com/desktop/desktop.git 2>/dev/null || true; git fetch desktop --tags

      - name: Detect newest upstream release
        id: latest
        run: |
          LATEST=$(git tag -l 'release-*' --sort=-v:refname | head -1)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release tag: $LATEST"

      - name: Compare with stack base
        id: compare
        run: |
          BASE="${{ env.STACK_BASE }}"
          LATEST="${{ steps.latest.outputs.latest }}"
          if [ "$LATEST" = "$BASE" ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "Stack base $BASE == latest upstream release. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "Stack base $BASE is BEHIND upstream $LATEST." >> "$GITHUB_STEP_SUMMARY"
            echo "Run locally: bash scripts/rebase-upstream.sh" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update tracking issue
        if: steps.compare.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="${{ steps.latest.outputs.latest }}"
          TITLE="Upstream sync needed: ${LATEST}"
          BODY="Upstream desktop/desktop published \`${LATEST}\`; stack base is \`${{ env.STACK_BASE }}\`.\n\nRun locally:\n\n\`\`\`bash\nbash scripts/rebase-upstream.sh\n\`\`\`\n\nConflict contract: main.ts uses merge-file (preserve confirm-reveal-directory); package.json 3-way merge (never checkout linux's); lockfiles regenerate via \`node vendor/yarn-1.21.1.js install\` (never hand-edit)."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title ${TITLE}" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
